# The smallest policy `fleet observe` runs on. Point a machine directory's
# `config.json` at a copy of this with its `fleet_toml` key.

[controller]
# Seconds between polls.
poll_seconds = 5

# Where a seat is told it is heavy. A fraction of the agent's context window,
# which is the agent's to change — so a release that only moves window sizes
# makes this number wrong with nothing reporting it.
rest_threshold_tokens = 700000

# How long a dispatch is given to be answered by a sighting before the seat is
# eligible again. A start that has not shown up yet is not a seat that needs
# another one.
arrival_window_seconds = 45

# How long a start is watched for an immediate failure, and how long a turn
# typed into a seat's session has to be taken — the seat's row reading busy.
start_watch_seconds = 5
nudge_timeout_seconds = 10

# The model a start names when the seat's own row does not, as the agent
# spells it. Every start names one: left out, it is the default the agent's
# adapter declares.
# default_model = "<model>"

# The posture a start asks for — one for a named seat, one for a spawned
# (transient) row — in fleet's own words: ask (ask a person before an act the
# rules do not allow), auto (act without asking, within the model's
# judgement) or unattended (nobody is there, so an act the rules do not allow
# is refused, not asked). Any other word is refused when the file is read.
posture = "auto"
transient_posture = "unattended"

# The models measured to honour a requested posture, matched BY PREFIX. A row
# whose start would ask for `auto` on a model outside this list is dropped at
# config read, because the downgrade is silent everywhere an instrument looks.
# Left out, it is the list the agent's adapter declares.
# auto_capable_models = ["<model prefix>"]

# The first turn a woken session is started with. `{seat}` is the seat
# directory.
first_turn = "/wake {seat}"

# The agent this fleet's seats run: the name of an agent adapter an installed
# pack carries, or the absolute path to an adapter executable. Left out, it is
# the claude-code pack's. The releases the agent is expected at are its
# adapter's to declare, and a live version outside them is a `substrate.moved`
# on the stream.
# [agent]
# adapter = "<name>"

# The test commands are in no table of this file, and a [gates] table that
# sets `suite` or `touched` is refused by name. They are the workflow's:
# `fleet land --test <command>` runs the landing's on the rebased tree, and
# `fleet dispatch --touched <command>` hands a builder its own gate. For the
# takeoff workflow, set them for the pack that carries it — a run's
# `--input test=` / `--input touched=` wins over these — and with neither set
# the flight lands NOT TESTED, and says so on every landed entry:
#
# [packs.tiny]
# takeoff.test = "cargo nextest run --workspace"
# takeoff.touched = "make test-touched"
