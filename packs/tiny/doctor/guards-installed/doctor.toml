description = "Each guard class's checks, and whether the targets they need are configured."
run = "run.sh"

# The default entry, shadowed to carry this pack's two classes as well as the
# two the defaults wire.
#
# A guard whose targets are not configured refuses nothing, which is a state a
# fleet can be in for a long time without noticing: nothing is refused and
# nothing says why. This entry is where it says so — and the two classes this
# pack adds are the ones it matters most for, because their targets are a glob
# and three lists that nothing else in the fleet reads.
