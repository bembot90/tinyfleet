[pack]
name = "tiny"
version = "0.1.0"
schema = 3
description = "The opinion: how this fleet designs, builds, reviews and holds itself."

[imports.ts]
source = "../ts"
version = "0.1.0"

# The settings a fleet sets for this pack under [packs.tiny] in its fleet.toml.
# Neither carries a default: a test command is the project's to name, and one
# this pack guessed would run on every project that named none.
[config."takeoff.test"]
description = "The command takeoff hands fleet land to run on the rebased tree before each landing."
type = "string"

[config."takeoff.touched"]
description = "The command takeoff hands each builder to run over its own diff before it delivers."
type = "string"
